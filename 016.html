<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System - Login</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-container { background-color: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 90%; max-width: 360px; text-align: center; }
        .logo { font-size: 50px; color: #1a73e8; margin-bottom: 10px; }
        h2 { color: #333; margin-bottom: 25px; font-size: 22px; }
        .input-group { text-align: left; margin-bottom: 15px; }
        .input-group label { display: block; font-size: 14px; color: #666; margin-bottom: 5px; }
        .input-group input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        .login-btn { width: 100%; padding: 12px; background-color: #1a73e8; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; margin-top: 15px; }
        .footer-text { margin-top: 25px; font-size: 12px; color: #888; }
    </style>
</head>
<body>
<div class="login-container">
    <div class="logo">🎓</div>
    <h2>Student Management System</h2>
    <div class="input-group"><label>Username</label><input type="text" value="admin"></div>
    <div class="input-group"><label>Password</label><input type="password" value="1234"></div>
    <button class="login-btn" onclick="alert('लॉगिन सफल! अब हम डैशबोर्ड बनाएंगे।')">➡️ Login</button>
    <div class="footer-text">Default Credentials: admin | 1234</div>
</div>
</body>
</html>
